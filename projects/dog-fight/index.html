<!DOCTYPE html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crimson Dawn — 紅の暁</title>
<meta name="description" content="A Ghibli-flavoured aerial dogfight rendered in real time with Three.js: two propeller fighters duel beneath a red dawn, trailing white smoke from every wingtip." />
<meta name="theme-color" content="#1a1020" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='72%25' r='75%25'%3E%3Cstop offset='0' stop-color='%23ffe6b0'/%3E%3Cstop offset='.45' stop-color='%23f2683d'/%3E%3Cstop offset='1' stop-color='%232b1d40'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='url(%23g)'/%3E%3Cpath d='M32 20l3 9 15 3-15 3-3 9-3-9-15-3 15-3z' fill='%23fff3d6' opacity='.92'/%3E%3C/svg%3E" />

  <link rel="stylesheet" crossorigin href="./assets/index-B66Q4G1R.css">

<body>
  <canvas id="scene"></canvas>

  <!-- film HUD, sits inside the 2.39:1 matte -->
  <div id="hud">
    <div id="slate">
      <div id="slate-shot">000 · —</div>
      <div id="slate-info">00:00:00</div>
    </div>
    <div id="phase">THE MERGE</div>
    <button id="mute" type="button">SOUND ON</button>
    <div id="keys">
      <span><b>SPACE</b> cut</span>
      <span><b>F</b> free camera</span>
      <span><b>M</b> sound</span>
      <span><b>H</b> hide overlay</span>
    </div>
  </div>

  <!-- title card -->
  <div id="overlay">
    <div class="card">
      <div class="kanji">紅 の 暁</div>
      <h1>CRIMSON DAWN</h1>
      <p class="tag">Two propeller fighters. One red morning above the cloud sea.</p>
      <button id="begin" type="button"><span>▶</span> ROLL CAMERA</button>
      <p class="hint">headphones recommended · click anywhere to begin</p>
    </div>
    <div class="vign"></div>
  </div>

  <noscript><p style="color:#fff;font:16px system-ui;padding:2rem">This scene needs JavaScript and WebGL2.</p></noscript>
</body>
</html>
